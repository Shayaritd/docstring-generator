version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BASE_MODEL=\
      - ADAPTER_PATH=\
      - GENERATION_TIMEOUT_SECONDS=\
      - LOG_LEVEL=\
      - HF_HOME=/model_cache
    volumes:
      - model_cache:/model_cache
      - ./adapters:/adapters
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  model_cache:
